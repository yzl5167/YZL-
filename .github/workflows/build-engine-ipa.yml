name: Engine baseline (M2-b experiment)

# M2-b：在 GitHub 托管 macOS runner 上从 Amethyst 上游源码构建引擎，
# 实测 docs/POJAV-ENGINE-AUDIT.md §10 的两个待验证项：
#   1. 托管 runner 能否装齐 cmake / ldid / JDK8 并跑通 make payload；
#   2. 产物能否带 java_runtimes + Frameworks 全套 payload。
# 第二阶段接线：构建 YZLUI.framework 并注入 payload（fork 补丁③的
# 根视图 dlopen 未应用时，框架只是不被加载，无害）。
# 设计与执行手册见 docs/M2B-ENGINE.md。

on:
  push:
    branches: [main]
    paths:
      - "YZLUI/**"
      - "engine/**"
      - "project.yml"
      - ".github/workflows/build-engine-ipa.yml"
  workflow_dispatch:
    inputs:
      amethyst_ref:
        description: 'Amethyst pin（分支名 / SHA / tag）'
        required: false
        default: 'main'
      zulu_jre:
        description: '已弃用：8/17/21 固定使用 Vlad iOS aarch64 真 JRE（保留参数仅为兼容）'
        required: false
        default: ''

jobs:
  build-engine:
    # 上游 Amethyst main 已使用 iOS 26 SDK 专属 API（如 UIBarButtonItem.sharesBackground，
    # Xcode 26 才有），macos-15 的 Xcode 16.4 编不过——用 macos-26 镜像（自带 Xcode 26）
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Amethyst
        run: |
          # MobileGlues 等是 git 子模块，必须一并拉取，否则 CMake 报源目录不存在
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/AngelAuraMC/Amethyst-iOS.git amethyst
          cd amethyst
          if [ -n "${{ inputs.amethyst_ref }}" ] && [ "${{ inputs.amethyst_ref }}" != "main" ]; then
            git fetch --depth 1 origin "${{ inputs.amethyst_ref }}" || true
            git checkout "${{ inputs.amethyst_ref }}" || echo "WARN: checkout 失败，使用 main"
          fi
          git rev-parse HEAD | tee ../amethyst-commit.txt

      - name: Install toolchain
        run: |
          brew install cmake ldid coreutils xcodegen || brew upgrade cmake ldid coreutils xcodegen

      - uses: actions/setup-java@v5
        with:
          # Temurin 没有 macOS ARM64 的 JDK 8（macos-15 是 M1），用 Azul Zulu
          distribution: zulu
          java-version: '8'

      - name: Apply YZL fork patches (best effort)
        run: |
          bash engine/apply-fork-patches.sh "$GITHUB_WORKSPACE/amethyst" || \
            echo "::warning::补丁应用失败，基线按未打补丁构建"

      # 先产 UI framework（不依赖引擎）。-target 式构建产物默认在项目内 build/，
      # 显式 -derivedDataPath 让产物路径可预测。
      # 这里必须硬失败：资源目录存在但二进制链接失败时，旧逻辑会继续注入一个
      # 空壳 YZLUI.framework，最终包里没有 YZL，真机只能看到 Amethyst 原生 UI。
      - name: Build YZLUI framework
        id: yzlui
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project YZLLauncher.xcodeproj -target YZLUI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            SYMROOT="$GITHUB_WORKSPACE/yzlui-sym" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee yzlui-build.log
          FW="$GITHUB_WORKSPACE/yzlui-sym/Release-iphoneos/YZLUI.framework"
          if [ ! -d "$FW" ]; then
            echo "::error::YZLUI.framework 未生成"
            grep -n "error:" yzlui-build.log | head -40 || true
            exit 1
          fi
          if [ ! -f "$FW/YZLUI" ]; then
            echo "::error::YZLUI.framework 缺少可执行文件（只有资源，没有 Mach-O）"
            echo "::error::以下为编译/链接错误摘要"
            grep -n "error:" yzlui-build.log | head -40 || true
            ls -la "$FW"
            exit 1
          fi
          echo "framework=$FW" >> "$GITHUB_OUTPUT"
          ls -la "$FW/YZLUI"

      # RUNNER=1 时 Amethyst 的 METHOD_JAVA_UNPACK 有意跳过下载（依赖预置压缩包）。
      # 2026-11-17 修复：旧 assets.angelauramc.dev / Wayback / Pojav v2.2 路径
      # 只能拿到 Java 17 或空壳，导致 verifier 正确拒绝出包。8/17/21 统一改用
      # Vlad-Games PojavLauncher_iOS 3.0 的 iOS aarch64 真 JRE，缺失即硬失败。
      # Java 25 仍按用户要求做 macOS aarch64 → iOS 实验性转换，失败只告警。
      - name: Pre-stage JRE archives (Vlad iOS aarch64 + experimental JRE25)
        working-directory: amethyst
        run: |
          set -euo pipefail
          mkdir -p depends && cd depends

          JRE_API_BASE="https://api.github.com/repos/Vlad-Games/PojavLauncher_iOS/releases/assets"
          JRE_DIRECT_BASE="https://github.com/Vlad-Games/PojavLauncher_iOS/releases/download/3.0"

          stage_ios_jre() {
            local v="$1" asset_id="$2" inner tar
            local zip="jre${v}-src.zip"
            echo "jre$v: downloading GitHub release asset $asset_id"
            if ! curl -fL --retry 5 --retry-all-errors --retry-delay 5 --max-time 900 \
              -H "Accept: application/octet-stream" \
              "$JRE_API_BASE/$asset_id" -o "$zip"; then
              echo "jre$v: API asset download failed, fallback to direct release URL"
              rm -f "$zip"
              curl -fL --retry 3 --retry-all-errors --retry-delay 5 --max-time 900 \
                "$JRE_DIRECT_BASE/jre${v}-ios-aarch64.zip" -o "$zip" || {
                  echo "::error::jre$v 下载失败"
                  return 1
                }
            fi
            inner="$(unzip -Z1 "$zip" 2>/dev/null | grep -E '\.tar\.xz$' | head -1)"
            if [ -z "$inner" ]; then
              echo "::error::jre$v zip 内无 tar.xz"
              rm -f "$zip"
              return 1
            fi
            unzip -oq "$zip" "$inner" && rm -f "$zip"
            rm -rf "jre${v}-x" && mkdir -p "jre${v}-x"
            tar -xJf "$inner" -C "jre${v}-x" || {
              echo "::error::jre$v 解压失败"
              return 1
            }
            rm -f "$inner"
            if [ ! -f "jre${v}-x/release" ]; then
              local relroot
              relroot="$(dirname "$(find "jre${v}-x" -type f -name release | head -1)")"
              if [ -z "$relroot" ] || [ "$relroot" = "." ]; then
                echo "::error::jre$v 无 release 标记"
                return 1
              fi
              rm -rf "java-${v}-openjdk" && mv "$relroot" "java-${v}-openjdk"
            else
              rm -rf "java-${v}-openjdk" && mv "jre${v}-x" "java-${v}-openjdk"
            fi
            rm -rf "jre${v}-x"
            if [ ! -f "java-${v}-openjdk/release" ] || [ ! -d "java-${v}-openjdk/lib" ]; then
              echo "::error::jre$v 暂存后缺 release/lib"
              return 1
            fi
            echo "jre$v staged ($(du -sh "java-${v}-openjdk" | cut -f1))"
          }

          # Java 8/17/21 是必需运行时；任何一个失败都立即停止，不再生成空壳包。
          stage_ios_jre 8 343387141
          stage_ios_jre 17 343387165
          stage_ios_jre 21 343387176

          # Java 25：用户要求纳入，但官方无 iOS 构建；按 build-engine.sh 同款实验转换。
          if command -v vtool >/dev/null 2>&1; then
            echo "jre25: experimental macOS aarch64 JDK25 -> iOS platform flip"
            if curl -fL --retry 3 --max-time 1200 \
                "https://aka.ms/download-jdk/microsoft-jdk-25.0.5.0.2-macos-aarch64.tar.gz" \
                -o jdk25-macos.tar.gz; then
              rm -rf jdk25-x && mkdir -p jdk25-x
              if tar -xzf jdk25-macos.tar.gz -C jdk25-x; then
                home25="$(dirname "$(find jdk25-x -type f -name release | head -1)")"
                if [ -n "$home25" ] && [ -f "$home25/release" ]; then
                  find "$home25" -type f -perm -u+x | while read -r f; do
                    if file "$f" 2>/dev/null | grep -q 'Mach-O'; then
                      vtool -arch arm64 -set-build-version ios 15.0 26.0 -replace -output "$f" "$f" 2>/dev/null || true
                      ldid -S "$f" 2>/dev/null || true
                    fi
                  done
                  rm -rf java-25-openjdk && cp -R "$home25" java-25-openjdk
                  echo "jre25 staged (experimental, $(du -sh java-25-openjdk | cut -f1))"
                else
                  echo "::warning::jre25 解包后无 release，跳过"
                fi
              else
                echo "::warning::jre25 解压失败，跳过"
              fi
              rm -rf jdk25-x jdk25-macos.tar.gz
            else
              echo "::warning::jre25 下载失败，跳过"
            fi
          else
            echo "::warning::无 vtool，跳过实验性 jre25"
          fi

          ls -la

      # payload 目标组装 app 并签名，但不打 ipa zip——注入框架后我们自行打包。
      - name: Build engine payload (make payload)
        working-directory: amethyst
        run: |
          set -o pipefail
          # Amethyst 的 Makefile 用 /usr/libexec/java_home -v 1.8 找 BOOTJDK，
          # setup-java 装的 JDK 不在 java_home 注册表里——显式传 BOOTJDK 覆盖。
          # 上游 JavaApp/Makefile 写的是：
          #   launcher.jar: $(CLASSES) check_empty_classes
          # 两个依赖并列，-jN 下 check_empty_classes 会与 javac 同时启动，
          # 把正在写入的 0 字节 .class 当成编译失败（不是偶发，是必然竞态）。
          # 让检查显式依赖 $(CLASSES)，make 就必须等全部 javac 完成。
          MF=JavaApp/Makefile
          python3 "$GITHUB_WORKSPACE/engine/fix-check-empty-classes.py" "$MF"
          grep -n 'check_empty_classes' "$MF" | head -5

          run_make() {
            make -j"$1" payload RUNNER=1 TROLLSTORE_JIT_ENT=1 RELEASE=1 \
              BOOTJDK="$JAVA_HOME/bin" 2>&1 | tee engine-build.log
          }
          # 兜底：上游若再次改动导致竞态复现，清掉全部 0 字节 class 后单线程重跑。
          if ! run_make "$(sysctl -n hw.ncpu)"; then
            if grep -q "found empty class files" engine-build.log; then
              echo "::warning::check_empty_classes 仍误报，清理全部空 class 后单线程重跑"
              find . -type f -name '*.class' -size 0 -delete
              run_make 1
            else
              echo "::error::make payload 失败（非竞态错误），见 engine-build.log"
              tail -n 60 engine-build.log
              exit 1
            fi
          fi

      - name: Rebrand payload (YZL name + icon + bundle id)
        run: |
          APP=$(find amethyst/artifacts -type d -name "AngelAuraAmethyst.app" | head -1)
          if [ -z "$APP" ]; then echo "::warning::未找到 app，跳过品牌重写"; exit 0; fi
          PLIST="$APP/Info.plist"
          plutil -replace CFBundleDisplayName -string "YZL Launcher" "$PLIST"
          plutil -replace CFBundleName -string "YZL" "$PLIST"
          # Bundle ID 保持上游原值（第十三轮改 id 后出现无法安装，先回退排除；
          # Bundle ID 对用户不可见）
          # 图标：仓库里的 YZL 1024 图标缩放出各尺寸 PNG，走 Info.plist 传统图标机制
          ICON_SRC="$GITHUB_WORKSPACE/YZLLauncher/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ -f "$ICON_SRC" ]; then
            sips -z 120 120 "$ICON_SRC" --out "$APP/AppIcon60x60@2x.png" >/dev/null
            sips -z 180 180 "$ICON_SRC" --out "$APP/AppIcon60x60@3x.png" >/dev/null
            sips -z 152 152 "$ICON_SRC" --out "$APP/AppIcon76x76@2x~ipad.png" >/dev/null
            sips -z 167 167 "$ICON_SRC" --out "$APP/AppIcon83.5x83.5@2x~ipad.png" >/dev/null
            plutil -replace CFBundleIcons -json '{"CFBundlePrimaryIcon":{"CFBundleIconFiles":["AppIcon60x60@2x","AppIcon60x60@3x"],"UIPrerenderedIcons":false}}' "$PLIST"
            plutil -replace "CFBundleIcons~ipad" -json '{"CFBundlePrimaryIcon":{"CFBundleIconFiles":["AppIcon60x60@2x","AppIcon60x60@3x","AppIcon76x76@2x~ipad","AppIcon83.5x83.5@2x~ipad"],"UIPrerenderedIcons":false}}' "$PLIST"
          fi
          # Info.plist 变了，主二进制重新伪签（TrollStore entitlement 保持）
          ldid -S$GITHUB_WORKSPACE/amethyst/entitlements.trollstore.xml "$APP/AngelAuraAmethyst"
          echo "rebrand done: $(plutil -extract CFBundleDisplayName raw "$PLIST")"

      - name: Inject YZLUI framework into payload
        if: steps.yzlui.outputs.framework != ''
        run: |
          set -euo pipefail
          APP=$(find amethyst/artifacts -type d -name "AngelAuraAmethyst.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::未找到 AngelAuraAmethyst.app，无法注入 YZLUI"; exit 1; fi
          mkdir -p "$APP/Frameworks"
          # 避免旧 framework 目录造成嵌套拷贝 / 空壳残留。
          rm -rf "$APP/Frameworks/YZLUI.framework"
          cp -R "${{ steps.yzlui.outputs.framework }}" "$APP/Frameworks/"
          if [ ! -f "$APP/Frameworks/YZLUI.framework/YZLUI" ]; then
            echo "::error::注入后缺少 YZLUI 可执行文件"
            find "$APP/Frameworks/YZLUI.framework" -maxdepth 2 -print || true
            exit 1
          fi
          # 签名必须对着最终字节算：先改 Load Commands，再统一打伪签。
          # 之前「先 ldid -S 再 install_name_tool」会让框架带着过期签名出货——
          # TrollStore 不校验签名所以装不上也看不出问题，但真机代签时 dlopen
          # 因签名无效静默失败，引擎直接回退 Amethyst 原生 UI（用户看到的
          # 「签完毫无 YZL 界面、和 PJL 一样」就是这么来的）。
          install_name_tool -add_rpath "@executable_path/Frameworks" \
            "$APP/Frameworks/YZLUI.framework/YZLUI" 2>/dev/null || true
          install_name_tool -add_rpath "@executable_path/Frameworks" \
            "$APP/AngelAuraAmethyst" 2>/dev/null || true
          # YZLUI 是 Swift 框架：iOS ≥12.2 系统自带 Swift 运行时，正常无需嵌
          # swift dylib；rpath 指向 @executable_path/Frameworks 兜住产物内依赖。
          ldid -S "$APP/Frameworks/YZLUI.framework/YZLUI"

          echo "YZLUI.framework 已注入 $APP/Frameworks"
          ls -la "$APP/Frameworks/YZLUI.framework"

      # 收尾统一伪签：这一步必须晚于一切会改二进制字节的操作
      # （Rebrand 改 Info.plist / install_name_tool 改 load commands）。
      # 签名时间点一旦落后，就会复现「过期签名 → dlopen 静默失败 → 原生 UI」。
      - name: Final ad-hoc re-sign (all Mach-O)
        run: |
          set -euo pipefail
          APP=$(find amethyst/artifacts -type d -name "AngelAuraAmethyst.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::未找到 app，无法收尾签名"; exit 1; fi
          ENT="$GITHUB_WORKSPACE/amethyst/entitlements.trollstore.xml"
          ldid -S"$ENT" "$APP/AngelAuraAmethyst"
          for dylib in "$APP"/Frameworks/*.dylib; do
            if [ -f "$dylib" ]; then ldid -S "$dylib"; fi
          done
          FW="$APP/Frameworks/YZLUI.framework/YZLUI"
          for bin in "$APP/AngelAuraAmethyst" "$FW"; do
            if ! otool -l "$bin" | grep -q LC_CODE_SIGNATURE; then
              echo "::error::$(basename "$bin") 缺少代码签名段"
              exit 1
            fi
          done
          echo "final resign OK: 主二进制 + YZLUI + 顶级 dylib 已统一补签"

      - name: Package TrollStore tipa
        run: |
          mkdir -p dist
          if [ -d amethyst/artifacts/Payload ]; then
            cd amethyst/artifacts
            zip -qry "$GITHUB_WORKSPACE/dist/YZL-engine.tipa" Payload
            cd - >/dev/null
          else
            echo "::error::Payload 目录不存在，无法出包"
            exit 1
          fi

      # 每次大修都要同时交付两种形态：
      #   YZL-engine.tipa                    TrollStore / 旧系统
      #   YZL-engine-sideload-unsigned.ipa   iOS 18 侧载（SideStore / 轻松签 重签）
      # 严禁把 tipa 直接 cp 改名成 unsigned.ipa：那是 ldid 伪签 + TrollStore
      # 私有 entitlement 的包，iOS 18 重签后要么装不上、要么打开纯黑屏
      # （YZL UI 加载不出来的最常见原因）。必须走脚本真正剥签重出。
      - name: Build clean sideload IPA (unsigned)
        run: |
          set -euo pipefail
          bash scripts/make-sideload-ipa.sh \
            "$GITHUB_WORKSPACE/amethyst/artifacts" \
            "$GITHUB_WORKSPACE/dist/YZL-engine-sideload-unsigned.ipa"

      - name: Verify engine payload completeness
        run: |
          set -euo pipefail
          # 校验项：YZLUI 二进制是真 Mach-O、JRE 8/17 真实可用、launcher.jar /
          # 图形翻译层 / Java 桥 jar 齐备；sideload 包额外校验签名与私有权限已清除。
          # JRE 21/25 缺席只告警并写进报告，不阻断构建（当前上游源确实拿不到）。
          python3 scripts/verify_engine_ipa.py \
            "$GITHUB_WORKSPACE/dist/YZL-engine.tipa" \
            --mode trollstore \
            --report "$GITHUB_WORKSPACE/dist/ENGINE-PAYLOAD-TROLLSTORE.txt"
          python3 scripts/verify_engine_ipa.py \
            "$GITHUB_WORKSPACE/dist/YZL-engine-sideload-unsigned.ipa" \
            --mode sideload \
            --report "$GITHUB_WORKSPACE/dist/ENGINE-PAYLOAD-SIDELOAD.txt"

      - name: Verify YZLUI binary inside final tipa
        run: |
          TIPA="$GITHUB_WORKSPACE/dist/YZL-engine.tipa"
          if unzip -l "$TIPA" | grep -q 'Frameworks/YZLUI.framework/YZLUI$'; then
            echo "OK: final tipa contains YZLUI.framework/YZLUI"
          else
            echo "::error::最终 tipa 缺少 Frameworks/YZLUI.framework/YZLUI"
            unzip -l "$TIPA" | grep 'YZLUI' || true
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist
          cp amethyst-commit.txt dist/ 2>/dev/null || true
          find . -maxdepth 2 -name 'engine-build.log' -exec cp {} dist/ \; || true
          find . -maxdepth 2 -name 'yzlui-build.log' -exec cp {} dist/ \; || true
          # 签名友好权限模板：全能签/轻松签「自定义权限」导入，防重签丢 get-task-allow
          cp engine/entitlements-jit-dev.plist dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload YZLUI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yzlui-build-log
          path: yzlui-build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-build-${{ inputs.amethyst_ref || 'main' }}
          path: dist/
          if-no-files-found: warn

      # 手机浏览器直接下载用：artifact 需要登录且下载慢，Release 任何人可下。
      # 每次构建覆盖 engine-latest 标签，永远是最新引擎包。
      - name: Refresh engine-latest GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete engine-latest --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          # 交付标准（2026-11-09 起）：tipa 与 unsigned ipa 是同一份含内核
          # （Amethyst fork 引擎 + java_runtimes + YZLUI）的包，两份同时出。
          # 纯 UI 外壳（com.yzl.launcher）只是开发预览，不再作为交付物。
          gh release create engine-latest \
            "$GITHUB_WORKSPACE/dist/YZL-engine.tipa" \
            "$GITHUB_WORKSPACE/dist/YZL-engine-sideload-unsigned.ipa" \
            "$GITHUB_WORKSPACE/dist/entitlements-jit-dev.plist" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YZL 引擎最新构建（engine-latest）" \
            --notes "commit ${{ github.sha }} · YZL-engine.tipa：TrollStore 直接装（已 ldid 伪签）。YZL-engine-sideload-unsigned.ipa：给 SideStore / 轻松签 用的**真·无签名**包，重签时必须选「重签所有文件（含 Frameworks 内动态库）」，否则 YZL UI 加载不出来、只剩黑屏。" \
            && echo "Release ready: https://github.com/$GITHUB_REPOSITORY/releases/tag/engine-latest"
