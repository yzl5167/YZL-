name: Relay engine artifact

# 临时中转：把某次引擎构建的 artifact 从 GitHub 拉到 runner，
# 再从 runner 上传到几个公开临时网盘，便于本机绕开慢速 Azure Blob 下载。
# 用完可删除本工作流。产物不含任何账号令牌。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Engine workflow run id'
        required: true
        default: '42220940394'

permissions:
  actions: read
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download engine artifact from run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" -n engine-build-main -D art --repo "${{ github.repository }}"
          find art -type f -printf '%p %s\n'
          # 两种安装形态都要中转：TrollStore tipa 和 iOS 18 干净侧载 IPA
          find art -type f \( -name '*.tipa' -o -name '*sideload-unsigned.ipa' \) | sort > packages.txt
          test -s packages.txt
          echo "待中转包："; cat packages.txt

      - name: Upload to public mirrors
        run: |
          set -uo pipefail
          while IFS= read -r PKG; do
            [ -f "$PKG" ] || continue
            NAME=$(basename "$PKG")
            echo "===== uploading $NAME ====="
            ls -la "$PKG"
            echo '--- pixeldrain ---'
            curl -sS --max-time 900 -T "$PKG" "https://pixeldrain.com/api/file/$NAME" \
              | tee "pixel-$NAME.json" || true
            echo '--- gofile ---'
            curl -sS --max-time 900 -F "file=@$PKG" https://store1.gofile.io/uploadFile \
              | tee "gofile-$NAME.json" || true
          done < packages.txt

      - name: Print links
        if: always()
        run: |
          echo "包清单："; cat packages.txt 2>/dev/null || true
          for f in pixel-*.json gofile-*.json; do
            echo "===== $f ====="
            cat "$f" 2>/dev/null || true
            echo
          done
